    *{box-sizing:border-box}body{margin:0 auto;max-width:1100px;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}h1{margin:0 0 4px;font-size:26px}h2{margin:0 0 10px;font-size:16px}.mute{color:var(--mute);margin:0 0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.big{font-size:44px;font-weight:700;line-height:1.1}.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.counts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}.chip{white-space:nowrap;font-size:13px}.chip:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}.msrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:8px;font-size:14px}.msrow .bar{grid-column:1/3}.filters{display:flex;gap:10px;margin-bottom:10px}select{padding:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600}.ok{color:var(--s6)}.unmet{color:var(--s5)}details{margin-top:4px;color:var(--mute)}summary{cursor:pointer}ul{margin:6px 0;padding-left:18px}
  </style>

<body>
  <h1>Self Tracker, Stage 5</h1>

    const LOG = {

      "M2-005":{files:"assets/icon.png, src/main/main.js, README.md",test:"pass",notes:"Created 256x256 PNG placeholder; Windows reports small and large window icon handles; npm start and workout logging passed. Nonfatal disk/GPU cache permission warnings."},

      "M2-010":{files:"ARCHITECTURE.md, README.md",test:"pass",notes:"Documented current repo map, roles, security, localStorage, log path, run/test commands, and SQLite as planned pending M3-001; verified all documented repository paths exist."},
      "M3-001":{files:"ARCHITECTURE.md, README.md",test:"pass",notes:"Recorded decision to use node:sqlite DatabaseSync in the Electron main process; implementation remains planned pending M3-002 verification."},
      "M3-002":{files:"src/main/db/probe.js, src/main/main.js, test/sqlite-available.test.js, ARCHITECTURE.md, README.md",test:"pass",notes:"Verified node:sqlite in Electron 44.5.1; SQLite 3.53.4 logged at startup; npm test passed 2/2; no database dependency added."},
      "M3-003":{files:"src/main/db/connection.js, src/main/main.js, test/connection.test.js, ARCHITECTURE.md, README.md",test:"pass",notes:"Opens :memory: after app readiness and closes before quit; log confirms both lifecycle events. Tests confirm foreign_keys=1, busy_timeout=5000, and close is idempotent."},
      "M3-004":{files:"src/main/main.js, .gitignore, ARCHITECTURE.md, README.md",test:"pass",notes:"Database opens at userData/self-tracker.db, directory is created when missing, and full path is logged. Close log verified; second app start reopened the file. No .db file in repo."},

      "M3-006":{files:"src/main/db/migrate.js, src/main/db/migrations/index.js, src/main/main.js, test/migrate.test.js, ARCHITECTURE.md, README.md",test:"pass",notes:"Migration runner sorts pending migrations, applies each in a transaction, records version/name/applied_at, skips applied versions, rolls back failures, and rejects a database newer than known migrations. Current migration list is empty; npm test passes and npm start opens/closes without errors."}
    };
    /* Details are only written for tasks that are READY or next in line. */
    const D = {
      "M0-003":{ac:["Tag v0-web exists locally","Tag is visible on GitHub"],test:"Run: git tag v0-web, then git push origin v0-web, then open the repo Tags page."},
      "M2-001":{ac:["node -v prints a version","npm -v prints a version"],test:"Open a new VS Code terminal and run node -v and npm -v."},
      "M2-002":{ac:["npm start opens a desktop window","Window shows the current index.html unchanged","Done button still saves and lists entries","Only package.json, main.js, .gitignore (node_modules/) and lockfile change"],test:"Run npm start, add two entries, close and reopen the app, entries still listed."}
    };
    /* Extra cross-milestone dependencies. Default: previous task in the same milestone,
       or the last task of the milestone it follows. */
    const DEP = {"M5-003":"M5-002,M1-006","M7-002":"M7-001,M1-005","M8-008":"M8-007,M1-004","M13-008":"M13-007,M4-003","M9-001":"M8-002"};
    /* Who does each task. Default is AI (writes all code). CLAUDE plans, researches, decides and reviews. USER installs, runs and tests. */
    const OWN = {CLAUDE:"M0-001,M0-002,M0-004,M1-002,M1-003,M1-004,M1-005,M1-006,M1-007,M1-008,M3-001,M13-001,M17-001",USER:"M2-001,M16-006,M16-007,M17-005,M18-007,M19-006"};
    const ownerOf = id => OWN.CLAUDE.split(",").includes(id) ? "CLAUDE" : OWN.USER.split(",").includes(id) ? "USER" : "AI";
    const STATUSES = ["NOT STARTED","READY","IN PROGRESS","WAITING FOR USER","TESTING","BLOCKED","DONE"];
    const SC = {"NOT STARTED":0,"READY":1,"IN PROGRESS":2,"WAITING FOR USER":3,"TESTING":4,"BLOCKED":5,"DONE":6};
    /* milestone id: [name, priority, follows] */
    const MS = {
      M0:["Existing Project Audit","P1",""],M1:["Requirements & Evidence Research","P1","M0"],M2:["Desktop Architecture","P1","M0"],M3:["Local Database","P1","M2"],M4:["Workout Tracking","P1","M3"],M5:["Exercise & Muscle Library","P1","M3"],M6:["YouTube Learning","P2","M5"],M7:["Nutrition","P2","M3"],M8:["Food Database","P2","M7"],M9:["Budget & Meal Planner","P2","M8"],M10:["Shopping List","P3","M9"],M11:["Body Progress","P2","M3"],M12:["Recovery","P3","M4"],M13:["Dashboard & Analytics","P2","M4"],M14:["Notifications & Settings","P3","M3"],M15:["Backup / Import / Export","P2","M3"],M16:["Testing & Reliability","P2","M13"],M17:["Windows Packaging","P1","M16"],M18:["UI/UX Polish","P3","M16"],M19:["Documentation","P2","M17"]
    };
    const RAW = `M0-001|Inventory current files and features

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const stOf = id => ST[id] || "NOT STARTED";
    const chip = s => `<span class="chip" style="--c:var(--s${SC[s]})">${s}</span>`;
    const pct = (a,b) => b ? 100*a/b : 0;
    const T = RAW.trim().split("\n").map(l => {const [id,name] = l.split("|");return {id,name,ms:id.split("-")[0]}});
    const prev = {}, lastOf = {};
    T.forEach(t => {const m=MS[t.ms];t.pri=m[1];const d=DEP[t.id]!==undefined?DEP[t.id]:(prev[t.ms]||lastOf[m[2]]||"");t.deps=d?d.split(","):[];prev[t.ms]=t.id;lastOf[t.ms]=t.id});
    const total=T.length, done=T.filter(t=>stOf(t.id)==="DONE").length;
    $("overall").innerHTML=`<h2>Overall progress</h2><div class="big">${pct(done,total).toFixed(1)}%</div><div class="bar"><i style="width:${pct(done,total)}%"></i></div><p class="mute">${done} of ${total} tasks done</p><div class="counts">`+STATUSES.map(s=>`<span>${chip(s)} ${T.filter(t=>stOf(t.id)===s).length}</span>`).join("")+`</div><p class="mute">Remaining tasks by owner: `+["AI","CLAUDE","USER"].map(o=>`${o} ${T.filter(t=>ownerOf(t.id)===o&&stOf(t.id)!=="DONE").length}`).join(", ")+`</p>`;
    const active=["IN PROGRESS","WAITING FOR USER","TESTING"];
    const cur=T.find(t=>active.includes(stOf(t.id))), nxt=T.find(t=>stOf(t.id)==="READY"), blk=T.filter(t=>stOf(t.id)==="BLOCKED");
    const line=(k,t)=>`<p><b>${k}</b><br>${t?esc(t.id)+" "+esc(t.name):"none"}</p>`;
    $("focus").innerHTML="<h2>Focus</h2>"+line("Current task",cur)+line("Next ready task",nxt)+`<p><b>Blocked</b><br>${blk.length?blk.map(t=>esc(t.id)).join(", "):"none"}</p>`;
    $("ms").innerHTML=Object.keys(MS).map(k=>{const L=T.filter(t=>t.ms===k),d=L.filter(t=>stOf(t.id)==="DONE").length;return `<div class="msrow"><span>${k} ${esc(MS[k][0])}</span><span>${d}/${L.length}</span><div class="bar"><i style="width:${pct(d,L.length)}%"></i></div></div>`}).join("");

    function rows(){
      const m=$("fm").value,s=$("fs").value;
      $("rows").innerHTML=T.filter(t=>(!m||t.ms===m)&&(!s||stOf(t.id)===s)).map(t=>{
        const L=LOG[t.id]||{},d=D[t.id];
        const deps=t.deps.map(x=>`<span class="${stOf(x)==="DONE"?"ok":"unmet"}">${x}</span>`).join(" ")||"none";
        const det=d?`<details><summary>Criteria and test</summary><ul>${d.ac.map(a=>`<li>[ ] ${esc(a)}</li>`).join("")}</ul><p>Test: ${esc(d.test)}</p></details>`:"";
        const note=[L.done?"Done "+L.done:"",L.files?"Files: "+L.files:"",L.notes||""].filter(Boolean).map(esc).join(". ");
        return `<tr><td>${t.id}</td><td>${esc(t.name)}${det}</td><td>${ownerOf(t.id)}</td><td>${t.pri}</td><td>${deps}</td><td>${chip(stOf(t.id))}</td><td>${esc(L.test||"-")}</td><td>${note}</td></tr>`;
      }).join("");
    }
    $("fm").onchange=rows;
    $("fs").onchange=rows;
